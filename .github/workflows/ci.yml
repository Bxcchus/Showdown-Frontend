name: Pinkward Web CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinkward-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0
          detect --source=/repo --no-git --config=/repo/.gitleaks.toml --redact --exit-code=1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install, audit, lint and test
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build
      - name: End-to-end browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
